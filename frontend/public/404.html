<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Clear Progress</title>
    <script>
      // SPA redirect trick for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // pathSegmentsToKeep = 1 preserves the /<repo-name> segment
      const pathSegmentsToKeep = 1;
      let l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
