<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-512.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#69b23e" />
    <link rel="manifest" href="/manifest.json" />
    <title>Clear Progress</title>
    <script>
      // Restore SPA route encoded by 404.html (GitHub Pages SPA trick)
      // https://github.com/rafgraph/spa-github-pages
      (function (location) {
        if (location.search[1] === "/") {
          let decoded = location.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            });
          window.history.replaceState(
            null,
            null,
            decoded[0] +
              (decoded.slice(1).join("&")
                ? "&" + decoded.slice(1).join("&")
                : "") +
              location.hash,
          );
        }
      })(window.location);
    </script>
    <script>
      try {
        // Helper function to convert hex to RGB
        function hexToRgb(hex) {
          let cleanHex = hex.replace(/^#/, "");
          if (!/^[0-9A-Fa-f]{6}$/.test(cleanHex)) {
            return null;
          }
          let r = parseInt(cleanHex.substring(0, 2), 16);
          let g = parseInt(cleanHex.substring(2, 4), 16);
          let b = parseInt(cleanHex.substring(4, 6), 16);
          return r + " " + g + " " + b;
        }

        let accentColorValues = {
          green: "#69b23e",
          coral: "#fb7185",
          orange: "#f57c00",
          yellow: "#f4c943",
          blue: "#2563eb",
          indigo: "#4f46e5",
          purple: "#a855f7",
        };
        let accentColor = localStorage.getItem("accent_color");

        if (accentColor === "custom") {
          // Handle custom color
          let isDark = document.documentElement.classList.contains("dark");
          let customLight = localStorage.getItem("custom_accent_light");
          let customDark = localStorage.getItem("custom_accent_dark");
          let hex = isDark ? customDark : customLight;

          if (hex) {
            let rgb = hexToRgb(hex);
            if (rgb) {
              document.documentElement.setAttribute("data-accent", "custom");
              document.documentElement.style.setProperty("--color-accent", rgb);
              let metaThemeColor = document.querySelector(
                'meta[name="theme-color"]',
              );
              if (metaThemeColor) {
                metaThemeColor.setAttribute("content", hex);
              }
            }
          }
        } else if (accentColor && accentColorValues[accentColor]) {
          // Handle predefined colors
          document.documentElement.setAttribute("data-accent", accentColor);
          let metaThemeColor = document.querySelector(
            'meta[name="theme-color"]',
          );
          if (metaThemeColor) {
            metaThemeColor.setAttribute(
              "content",
              accentColorValues[accentColor],
            );
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
