<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-512.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#69b23e" />
    <link rel="manifest" href="/manifest.json" />
    <title>Clear Progress</title>
    <script>
      // Restore SPA route encoded by 404.html (GitHub Pages SPA trick)
      // https://github.com/rafgraph/spa-github-pages
      (function (location) {
        if (location.search[1] === "/") {
          var decoded = location.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            });
          window.history.replaceState(
            null,
            null,
            decoded[0] +
              (decoded.slice(1).join("&")
                ? "&" + decoded.slice(1).join("&")
                : "") +
              location.hash,
          );
        }
      })(window.location);
    </script>
    <script>
      try {
        let accentColorValues = {
          green: "#69b23e",
          coral: "#fb7185",
          orange: "#f57c00",
          yellow: "#f4c943",
          teal: "#0d9488",
          blue: "#2563eb",
          indigo: "#4f46e5",
          purple: "#a855f7",
        };
        let accentColor = localStorage.getItem("accent_color");
        if (accentColor && accentColorValues[accentColor]) {
          document.documentElement.setAttribute("data-accent", accentColor);
          var metaThemeColor = document.querySelector(
            'meta[name="theme-color"]',
          );
          if (metaThemeColor) {
            metaThemeColor.setAttribute(
              "content",
              accentColorValues[accentColor],
            );
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
