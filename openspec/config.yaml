schema: spec-driven

context: |
  # Clear Progress — Personal Productivity App

  ## Domain
  Personal productivity app suitable for the GTD methodology. Client-first architecture with swappable backends.

  ## Tech Stack
  - Monorepo (pnpm workspaces)
  - TypeScript, React, Vite, TailwindCSS
  - IndexedDB (Dexie) for local storage
  - Google Apps Script as backend (Google Sheets as DB)
  - Supabase as backend (PostgreSQL + Edge Functions + Auth)
  - Hexagonal architecture: domain → application (ports) → infrastructure (adapters)

  ## Packages
  - `packages/client` — React PWA (main app)
  - `packages/contract` — shared types and port interfaces
  - `packages/adapter-gas` — Google Apps Script adapter
  - `packages/adapter-inmemory` — in-memory adapter (tests)
  - `packages/adapter-supabase` — Supabase adapter (Edge Functions, PostgreSQL)
  - `packages/adapter-loader` — adapter loading/switching
  - `packages/integration` — integration tests (Playwright + Testcontainers)

  ## Key Patterns
  - Client-first: all data in IndexedDB, sync to server asynchronously
  - Soft delete (is_deleted flag), optimistic UI
  - UUID v4 for IDs, generated client-side
  - Temporal API for date/time operations
  - TDD with mutation testing (Vitest, Stryker)
  - No hardcoded values — constants/enums required
  - Descriptive naming — no cryptic abbreviations

  ## Entities
  Tasks (with recurring support), Goals, Ideas, Contexts, Categories, Checklist Items, Settings

  ## Sync
  Push/pull protocol with backend. Last-write-wins conflict resolution.
  Dirty flag (needsSync) tracks local changes. Revision-based sync.

rules:
  proposal:
    - Always include Goals, Non-Goals, Requirements (FR/NFR/UX with IDs), Success Metrics
    - Include UI States Matrix for features with lists or complex state
    - Reference behavior specs in features/*.feature
    - |
      Proposal structure:
        # <Change name>
        ## Why — problem, audience, urgency
        ## What Changes — ADDED/MODIFIED/REMOVED capabilities
        ## Goals — G1, G2... (measurable)
        ## Non-Goals — NG1, NG2... (explicitly out of scope)
        ## Users & Scenarios — U1, U2...
        ## Requirements
        ### Functional — FR1, FR2...
        ### Non-Functional
        #### Performance — NFR-P1...
        #### Accessibility — NFR-A1...
        #### Responsive — NFR-R1...
        ## UX Acceptance Criteria — UX1, UX2...
        ## UI States Matrix (if feature has lists/complex state)
        | Network | Data | UI |
        ## Behavior — reference to features/<name>.feature (@<change-name> tags)
        ## Visual Reference — Figma link, design tokens are source of truth
        ## Affected IA — "no changes" or "requires IA-XXXX update"
        ## Success Metrics — M1, M2... (concrete numbers)
        ## Open Questions — Q1, Q2...
  design:
    - Only for non-trivial local decisions within a change
    - Global architectural decisions go to docs/adr/
    - Reference FR/NFR from proposal.md
  tasks:
    - Follow domain → application → infrastructure → UI layer order
    - Each task references FR/NFR it implements
    - Include verification tasks (tests, a11y, visual regression)
    - Break tasks into chunks of max 2 hours
  specs:
    - Use delta format: ADDED/MODIFIED/REMOVED
    - Mark invariants with "# implements FR-X of <change-name>"
    - Include use cases with inputs, effects, and errors
