name: CLA Assistant

on:
  pull_request_target:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: |
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'issue_comment' &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA.'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        with:
          path-to-document: "CLA.md"
          path-to-signatures: "signatures/cla.json"
          branch: "cla-signatures"
          allowlist: "dependabot[bot],renovate[bot],github-actions[bot]"
          custom-notsigned-prcomment: >
            Thank you for your contribution! Before we can merge this PR,
            you need to sign our [Contributor License Agreement](CLA.md).
            Please reply with the following to accept:


            > I have read the CLA Document and I hereby sign the CLA.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
