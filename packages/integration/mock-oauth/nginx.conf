# implements FR16, D8 of add-supabase-integration-tests
# Adapts GoTrue Keycloak provider paths to navikt/mock-oauth2-server issuer paths.
#
# GoTrue keycloak expects:          navikt serves (issuer "keycloak"):
#   /protocol/openid-connect/auth     /keycloak/authorize
#   /protocol/openid-connect/token    /keycloak/token
#   /protocol/openid-connect/userinfo /keycloak/userinfo
#
# GoTrue keycloak sends scope=profile+email but navikt requires openid.
# The auth location injects openid into the scope query parameter.

server {
    listen 8443;

    location /protocol/openid-connect/auth {
        # GoTrue sends scope=profile+email; navikt requires openid in scope.
        # Prepend openid to the scope parameter via query string rewrite.
        set $modified_args $args;
        if ($args ~ "^(.*)scope=([^&]*)(.*)$") {
            set $modified_args $1scope=openid+$2$3;
        }
        proxy_pass http://mock-oauth:8080/keycloak/authorize?$modified_args;
        proxy_set_header Host $host;
    }

    location /protocol/openid-connect/token {
        proxy_pass http://mock-oauth:8080/keycloak/token;
        proxy_set_header Host $host;
    }

    location /protocol/openid-connect/userinfo {
        proxy_pass http://mock-oauth:8080/keycloak/userinfo;
        proxy_set_header Host $host;
    }

    # Catch-all for navikt internal paths (login form action, assets, debugger)
    location /keycloak/ {
        proxy_pass http://mock-oauth:8080/keycloak/;
        proxy_set_header Host $host;
    }
}
