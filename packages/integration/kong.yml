# implements FR1, D6 of add-supabase-integration-tests
# Kong declarative config — routes requests to Supabase services
# Auth is handled by downstream services via JWT; no key-auth plugin needed for test env

_format_version: "1.1"

services:
  - name: auth-v1
    url: http://auth:9999
    routes:
      - name: auth-v1
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          headers:
            - Content-Type
            - Authorization
            - apikey
            - x-client-info

  - name: rest-v1
    url: http://rest:3000
    routes:
      - name: rest-v1
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          headers:
            - Content-Type
            - Authorization
            - apikey
            - x-client-info
            - Prefer

  - name: storage-v1
    url: http://storage:5000
    routes:
      - name: storage-v1
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          headers:
            - Content-Type
            - Authorization
            - apikey
            - x-client-info

  - name: functions-v1
    url: http://edge-functions:9000
    routes:
      - name: functions-v1
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          headers:
            - Content-Type
            - Authorization
            - apikey
            - x-client-info
