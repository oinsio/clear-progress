# SonarQube project configuration
sonar.projectKey=clear-progress-gtd
sonar.projectName=Clear Progress (GTD)

# Source directories
sonar.sources=backend/src,frontend/src

# Exclusions
sonar.exclusions=node_modules/**,dist/**,build/**,coverage/**,.next/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Test files
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage (Vitest + lcov)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
